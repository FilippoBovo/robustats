[build-system]
requires = ["setuptools>=61.0", "wheel", "numpy>=1.20.0"]
build-backend = "setuptools.build_meta"

[project]
name = "robustats"
version = "0.1.7"
description = "Robustats is a Python library for high-performance computation of robust statistical estimators"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "Filippo Bovo", email = "bovo.filippo@gmail.com"}
]
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "numpy>=1.20.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.0.0",
    "flake8>=7.0.0",
    "isort>=5.13.0",
    "mypy>=1.8.0",
]

[project.urls]
Homepage = "https://github.com/FilippoBovo/robustats"
Repository = "https://github.com/FilippoBovo/robustats"
Download = "https://github.com/FilippoBovo/robustats/archive/v0.1.7.tar.gz"

[tool.setuptools]
packages = ["robustats"]

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 120

[tool.flake8]
max-line-length = 120
extend-ignore = ["E203", "W503", "C901", "F401", "F403", "E722"]
max-complexity = 10

[tool.mypy]
ignore_missing_imports = true
show_error_context = true
show_column_numbers = true
show_error_codes = true
pretty = true
